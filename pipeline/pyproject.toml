[project]
name = "asaase-pipeline"
version = "0.1.0"
description = "Turns NISAR L-band GCOV radar products into web-ready layers for the Asaase app."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "asf_search>=8.0",
  "earthaccess>=0.11",
  "h5py>=3.10",
  "numpy>=1.26",
  "scipy>=1.11",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "pillow>=10.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
asaase = "asaase.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["asaase*"]

[tool.ruff]
line-length = 100
